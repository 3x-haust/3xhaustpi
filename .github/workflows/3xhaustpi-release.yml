name: 3xhaustPi native release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string
      source_ref:
        description: "Source ref to build and publish"
        required: false
        type: string
  push:
    tags:
      - "3xhaustpi-v*"

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - windows-arm64
          - windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@3xhaust/semantic-contract
      - run: npm run build --workspace=3xhaustpi
      - run: node packages/3xhaustpi/scripts/build-native-release.mjs --target ${{ matrix.target }} --output artifacts/native
      - uses: actions/upload-artifact@v4
        with:
          name: 3xhaustpi-${{ matrix.target }}
          path: artifacts/native/*
          if-no-files-found: error

  checksums:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: 3xhaustpi-*
          path: artifacts/native
          merge-multiple: true
      - name: Verify per-archive checksums and write release manifest
        working-directory: artifacts/native
        run: |
          for file in ./*.sha256; do sha256sum --check "$file"; done
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -- *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: 3xhaustpi-native-release
          path: artifacts/native/*
          if-no-files-found: error
      - name: Attach archives to tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" artifacts/native/* --generate-notes --verify-tag

  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=@3xhaust/semantic-contract
      - run: npm run build --workspace=3xhaustpi
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Publish npm package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/3xhaustpi/package.json').version")"
          if npm view "3xhaustpi@${version}" version --json >/dev/null 2>&1; then
            echo "3xhaustpi@${version} is already published"
            exit 0
          fi
          npm publish --workspace=3xhaustpi --access public --provenance --ignore-scripts
