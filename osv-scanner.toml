[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2027-01-20
reason = "node-forge@1.4.0 has no published fix, including in @earendil-works/gondolin@0.13.0. It is a runtime dependency of the standalone Gondolin extension example, not dev-only, and is absent from the coding-agent production shrinkwrap/install-lock. Gondolin uses forge for MITM certificates, including verification of cached leaf certificates; the signature-verification risk remains in that example. Keep the example functional while awaiting an upstream fix; recheck https://osv.dev/GHSA-86w9-cpqp-85rv before expiry."
